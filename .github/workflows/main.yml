name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # OKM 有多种 jar 变体（平台专用 / -dev / Forgix 合并包），类名可能带 _neoforge 后缀。
      # 依次尝试，谁能让 compileJava 通过就用谁。
      - name: Pick a usable OneKeyMiner jar
        run: |
          set -u
          BASE="https://github.com/Mai-xiyu/OneKeyMiner/releases/download/1.21.7-1.6.6"
          mkdir -p libs

          try_jar() {
            local name="$1" url="$2"
            echo "::group::尝试 OKM jar: $name"
            if ! curl -L --fail --retry 3 -sS -o libs/onekeyminer.jar "$url"; then
              echo "❌ 下载失败: $url"; echo "::endgroup::"; return 1
            fi
            if ! unzip -l libs/onekeyminer.jar | grep -q "org/xiyu/onekeyminer/api/OneKeyMinerAPI.class"; then
              echo "❌ 没有 OneKeyMinerAPI.class，跳过"; echo "::endgroup::"; return 1
            fi
            echo "--- org/xiyu/onekeyminer/shape/ 内容 ---"
            unzip -l libs/onekeyminer.jar | grep "onekeyminer/shape/" | head -20 || true
            echo "--- 试编译 ---"
            if gradle compileJava --no-daemon -q > /tmp/compile.log 2>&1; then
              echo "✅ 可用: $name"; echo "$name" > /tmp/okm_variant.txt
              echo "::endgroup::"; return 0
            fi
            echo "❌ 编译失败，前几条错误："
            grep -m 5 "error:" /tmp/compile.log || tail -n 25 /tmp/compile.log
            echo "::endgroup::"; return 1
          }

          try_jar "neoforge"        "$BASE/onekeyminer-neoforge-1.6.6-1.21.7.jar" \
          || try_jar "neoforge-dev" "$BASE/onekeyminer-neoforge-1.6.6-1.21.7-dev.jar" \
          || try_jar "universal"    "$BASE/onekeyminer-1.6.6-1.21.7.jar" \
          || { echo "::error::三份 OKM jar 都编译不过，请看上面各组的 error"; exit 1; }

          echo "最终使用的 OKM jar: $(cat /tmp/okm_variant.txt)"

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: okmshapeswitch-jar
          path: build/libs/*.jar
          if-no-files-found: error
