name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # 必须用 NeoForge 专用 jar；Modrinth 那个是 Forgix 合并包，类名带 _neoforge 后缀
      - name: Fetch OneKeyMiner (NeoForge)
        run: |
          mkdir -p libs
          URL="https://github.com/Mai-xiyu/OneKeyMiner/releases/download/1.21.7-1.6.6/onekeyminer-neoforge-1.6.6-1.21.7.jar"
          echo "下载: $URL"
          curl -L --fail --retry 3 -o libs/onekeyminer.jar "$URL"
          ls -l libs

          echo "--- 校验 jar ---"
          unzip -l libs/onekeyminer.jar | grep -q "org/xiyu/onekeyminer/api/OneKeyMinerAPI.class" \
            || { echo "::error::jar 里没有 OneKeyMinerAPI.class"; exit 1; }
          if unzip -l libs/onekeyminer.jar | grep -q "_neoforge\.class"; then
            echo "::error::这是 Forgix 合并包（类名带 _neoforge 后缀），请改用 onekeyminer-neoforge-*.jar"
            exit 1
          fi
          echo "OK: NeoForge 专用 OKM jar"

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: okmshapeswitch-jar
          path: build/libs/*.jar
          if-no-files-found: error
